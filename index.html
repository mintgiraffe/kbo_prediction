<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚾ KBO 승부예측</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Effect -->
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(232,200,74,.04) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(74,140,232,.05) 0%,transparent 60%);pointer-events:none;z-index:0"></div>

  <!-- Navigation -->
  <nav>
    <div class="nav-brand">⚾<span>승부예측</span></div>
    <div class="nav-tabs">
      <div class="nav-tab active" data-page="page-predict">예측하기</div>
      <div class="nav-tab" data-page="page-ranking">랭킹</div>
      <div class="nav-tab" data-page="page-history">내 기록</div>
      <div class="nav-tab admin-tab" data-page="page-admin">⚙️ 관리</div>
    </div>
  </nav>

  <!-- Connection Status Indicator -->
  <div class="conn-status">
    <span class="conn-dot"></span>
    <span id="connText">연결중...</span>
  </div>

  <!-- PREDICT PAGE -->
  <div id="page-predict" class="page active">
    <div class="hero">
      <div class="hero-date" id="dateDisplay">2024-05-26 (월)</div>
      <h1 class="hero-title">KBO <span class="acc">경기 예측</span></h1>
      <p class="hero-subtitle">경기 결과를 예측하고 랭킹을 올려보세요</p>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-num">0</div>
        <div class="stat-label">전체 경기</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">0</div>
        <div class="stat-label">내 예측</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">0</div>
        <div class="stat-label">적중수</div>
      </div>
    </div>

    <div class="main">
      <!-- Date Picker -->
      <div style="margin-bottom:24px">
        <input type="date" id="datePicker" style="width:100%;padding:10px;border:1px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text)">
      </div>

      <!-- User Info Card -->
      <div class="user-card">
        <div class="user-avatar">👤</div>
        <div class="user-input-wrap">
          <div class="field-label">닉네임</div>
          <input type="text" id="userName" placeholder="닉네임을 입력하세요">
        </div>
      </div>

      <div class="user-card">
        <div class="user-avatar">🔐</div>
        <div class="user-input-wrap">
          <div class="field-label">비밀번호</div>
          <input type="password" id="userPassword" placeholder="비밀번호를 입력하세요">
        </div>
      </div>

      <!-- Matches Section -->
      <div class="section-header">
        <h2 class="section-title">예측 경기</h2>
        <span class="section-count" id="matchCount">0경기</span>
      </div>

      <div id="matchesContainer" style="margin-bottom:20px"></div>

      <!-- Submit Buttons -->
      <div style="position:fixed;bottom:20px;left:0;right:0;padding:0 16px;max-width:760px;margin:0 auto;display:flex;gap:10px">
        <button class="btn btn-primary" style="flex:1" id="submitBtn" onclick="submitPicks()">
          예측 제출하기
        </button>
        <button class="btn btn-secondary" id="cancelBtn" style="display:none" onclick="cancelSubmit()">
          취소
        </button>
      </div>
    </div>
  </div>

  <!-- RANKING PAGE -->
  <div id="page-ranking" class="page">
    <div class="hero">
      <div class="hero-date" id="dateDisplay2">2024-05-26 (월)</div>
      <h1 class="hero-title"><span class="acc">랭킹</span></h1>
      <p class="hero-subtitle">예측 정확도 순위</p>
    </div>

    <div class="main" style="padding-bottom:80px">
      <div id="rankingContainer"></div>
    </div>
  </div>

  <!-- HISTORY PAGE -->
  <div id="page-history" class="page">
    <div class="hero">
      <div class="hero-date" id="dateDisplay3">2024-05-26 (월)</div>
      <h1 class="hero-title">내 <span class="acc">기록</span></h1>
      <p class="hero-subtitle">내가 예측한 경기들</p>
    </div>

    <div class="main" style="padding-bottom:80px">
      <div id="historyContainer"></div>
    </div>
  </div>

  <!-- ADMIN PAGE -->
  <div id="page-admin" class="page">
    <div class="hero">
      <div class="hero-date" id="dateDisplay4">2024-05-26 (월)</div>
      <h1 class="hero-title">⚙️ <span class="acc">관리</span></h1>
      <p class="hero-subtitle">경기 정보 및 결과 관리</p>
    </div>

    <div class="main" style="padding-bottom:80px">
      <!-- Match Editor -->
      <div class="admin-section">
        <div class="admin-section-title">📋 경기 정보 편집</div>
        <div id="matchEditorList"></div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-secondary" style="flex:1" onclick="addMatchEditor()">
            경기 1개 추가
          </button>
          <button class="btn btn-secondary" style="flex:1" onclick="addFiveMatches()">
            경기 5개 추가
          </button>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="applyMatches()">
          경기 정보 적용
        </button>
      </div>

      <!-- Result Editor -->
      <div class="admin-section">
        <div class="admin-section-title">✅ 경기 결과 입력</div>
        <div id="resultEditorList"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="saveResults()">
          결과 저장
        </button>
      </div>

      <!-- User Management -->
      <div class="admin-section">
        <div class="admin-section-title">👥 참여자 관리</div>
        <div id="adminUserList"></div>
      </div>

      <!-- Danger Zone -->
      <div class="admin-section" style="border-color:var(--red)">
        <div class="admin-section-title" style="color:var(--red)">⚠️ 위험 영역</div>
        <button class="btn btn-danger" style="width:100%" onclick="resetAllData()">
          모든 데이터 초기화
        </button>
      </div>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────── -->
  <!-- SCRIPTS (모듈식 구조) -->
  <!-- ─────────────────────────────────────────────────────────── -->

  <!-- Global State Management -->
  <script src="js/state.js"></script>

  <!-- Core Utilities -->
  <script src="js/core.js"></script>

  <!-- Specific Modules -->
  <script src="js/matches.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/admin.js"></script>

  <!-- Firebase (CDN 방식) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import {
      getDatabase,
      ref,
      set,
      get,
      remove,
      update,
      onValue,
      off
    } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

    let db = null;

    // Firebase 초기화
    window.initFirebase = (databaseURL) => {
      const firebaseConfig = {
        databaseURL: databaseURL
      };

      try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        window.db = db; // 전역 객체로 설정
        connStatus.show('online');
        console.log('✓ Firebase initialized');
        listenData();
      } catch (err) {
        console.error('✗ Firebase init error:', err);
        connStatus.show('offline');
        toast('Firebase 연결 실패', 'error');
      }
    };

    // 데이터 리스너
    window.listenData = () => {
      if (!db) return;

      onValue(
        ref(db, currentKey()),
        snapshot => {
          const data = snapshot.val();
          if (data?.matches) {
            setMatches(data.matches);
            if (data.participants) setRankings(data.participants);
            renderMatches();
            renderRanking();
            renderHistory();
            renderAdminPanel();
          }
        },
        err => {
          console.error('Listen error:', err);
          connStatus.show('offline');
        }
      );
    };

    // Firebase 초기화 실행
    window.initFirebase('https://kbo-prediction-72dfe-default-rtdb.firebaseio.com');
  </script>
</body>
</html>
